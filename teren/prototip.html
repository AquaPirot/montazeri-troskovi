<!DOCTYPE html>
<html lang="sr-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#22252A">
<title>Prohoreca AG group – Teren (prototip)</title>
<style>
/* ============================================================
   PROHORECA AG GROUP – TEREN
   Vizuelni prototip. Samostalan fajl, bez servera.
   ============================================================ */

:root{
  --grafit:#22252A;
  --grafit-2:#2E323A;
  --grafit-3:#3C424C;
  --zlatna:#C0994A;
  --zlatna-svetla:#DCBB6E;
  --zlatna-blaga:#F5EEDF;

  --pozadina:#F4F5F6;
  --karta:#FFFFFF;
  --linija:#E3E5E8;
  --linija-jaka:#CFD3D8;

  --tekst:#1B1D21;
  --tekst-2:#5C636D;
  --tekst-3:#8A9099;

  --zelena:#2C7A52;
  --zelena-bg:#E8F3ED;
  --narandzasta:#9A6414;
  --narandzasta-bg:#FBF0DE;
  --crvena:#A8322A;
  --crvena-bg:#FAEAE8;
  --plava:#2B5C8A;
  --plava-bg:#E9F0F7;

  --r-s:8px;
  --r-m:12px;
  --r-l:16px;
  --sen:0 1px 2px rgba(20,22,26,.06), 0 4px 14px rgba(20,22,26,.05);
  --sen-jaka:0 6px 24px rgba(20,22,26,.14);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--grafit);
  color:var(--tekst);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- okvir aplikacije ---------- */
#app{
  max-width:480px;margin:0 auto;min-height:100vh;
  background:var(--pozadina);
  display:flex;flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,.35);
  position:relative;
}

/* ---------- zaglavlje ---------- */
.top{
  background:var(--grafit);
  color:#fff;
  padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;
  border-bottom:2px solid var(--zlatna);
  position:sticky;top:0;z-index:40;
}
.top .marka{font-size:10px;letter-spacing:.16em;color:var(--zlatna);font-weight:700;text-transform:uppercase}
.top .naslov{font-size:17px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
.top .rast{flex:1}
.nazad{
  width:38px;height:38px;flex:none;border:1px solid var(--grafit-3);background:var(--grafit-2);
  border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;
}
.nazad:active{background:var(--grafit-3)}
.avatar{
  width:38px;height:38px;flex:none;border-radius:50%;background:var(--grafit-2);
  border:1px solid var(--zlatna);color:var(--zlatna-svetla);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;
}

/* ---------- sadržaj ---------- */
.sadrzaj{flex:1;padding:16px;padding-bottom:96px}
.sekcija-naslov{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tekst-3);margin:22px 2px 10px;
}
.sekcija-naslov:first-child{margin-top:4px}

/* ---------- kartice ---------- */
.karta{
  background:var(--karta);border:1px solid var(--linija);border-radius:var(--r-l);
  box-shadow:var(--sen);overflow:hidden;margin-bottom:12px;
}
.karta-telo{padding:16px}
.karta-zaglavlje{
  padding:12px 16px;border-bottom:1px solid var(--linija);
  display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst-2);
}

/* ---------- velika dugmad na početnoj ---------- */
.akcija{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  background:var(--karta);border:1px solid var(--linija);border-radius:var(--r-l);
  padding:16px;margin-bottom:12px;cursor:pointer;box-shadow:var(--sen);
}
.akcija:active{background:#FAFAFB;border-color:var(--linija-jaka)}
.akcija[disabled]{opacity:.45;cursor:default}
.akcija .ikona{
  width:52px;height:52px;flex:none;border-radius:var(--r-m);
  background:var(--grafit);color:var(--zlatna);
  display:flex;align-items:center;justify-content:center;
}
.akcija .tekst{flex:1;min-width:0}
.akcija .t1{font-size:17px;font-weight:700;letter-spacing:-.2px}
.akcija .t2{font-size:13px;color:var(--tekst-2);margin-top:2px}
.akcija .str{color:var(--tekst-3);flex:none}
.akcija.istaknuta .ikona{background:var(--zlatna);color:var(--grafit)}

/* ---------- statusne oznake ---------- */
.oznaka{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap;
}
.o-zelena{background:var(--zelena-bg);color:var(--zelena);border-color:#C9E3D6}
.o-narandzasta{background:var(--narandzasta-bg);color:var(--narandzasta);border-color:#EBD6AE}
.o-crvena{background:var(--crvena-bg);color:var(--crvena);border-color:#EFCFCB}
.o-plava{background:var(--plava-bg);color:var(--plava);border-color:#CBDCEC}
.o-siva{background:#EEF0F2;color:var(--tekst-2);border-color:var(--linija-jaka)}
.tacka{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- polja ---------- */
.polje{margin-bottom:16px}
.polje > label,.nalepnica{
  display:block;font-size:13px;font-weight:600;color:var(--tekst-2);margin-bottom:7px;
}
.nalepnica .opc{color:var(--tekst-3);font-weight:500}
.unos{
  width:100%;background:#fff;border:1.5px solid var(--linija-jaka);border-radius:var(--r-m);
  padding:14px 14px;font-size:17px;font-weight:500;outline:none;
}
.unos:focus{border-color:var(--grafit);box-shadow:0 0 0 3px rgba(34,37,42,.08)}
.unos::placeholder{color:var(--tekst-3);font-weight:400}
textarea.unos{min-height:88px;resize:vertical;font-size:16px;line-height:1.5}
.unos-sa-sufiksom{position:relative}
.unos-sa-sufiksom .sufiks{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:14px;font-weight:700;color:var(--tekst-3);pointer-events:none;
}
.unos-sa-sufiksom .unos{padding-right:56px}
.dva{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- izbor (segmenti / pločice) ---------- */
.plocice{display:grid;gap:8px}
.plocice.k2{grid-template-columns:1fr 1fr}
.plocice.k3{grid-template-columns:repeat(3,1fr)}
.plocica{
  background:#fff;border:1.5px solid var(--linija-jaka);border-radius:var(--r-m);
  padding:13px 10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;color:var(--tekst-2);
}
.plocica:active{background:#F7F8F9}
.plocica.izabrana{background:var(--grafit);border-color:var(--grafit);color:#fff}
.plocica.izabrana.zlato{background:var(--zlatna);border-color:var(--zlatna);color:var(--grafit)}
.plocica .mala{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:2px}

/* lista izbora sa ikonom */
.izbor-lista{display:grid;gap:8px}
.izbor{
  display:flex;align-items:center;gap:12px;background:#fff;
  border:1.5px solid var(--linija-jaka);border-radius:var(--r-m);padding:14px;cursor:pointer;text-align:left;width:100%;
}
.izbor .ik{width:34px;height:34px;flex:none;border-radius:var(--r-s);background:#F0F1F3;color:var(--grafit);display:flex;align-items:center;justify-content:center}
.izbor .nas{font-size:16px;font-weight:600}
.izbor.izabrana{border-color:var(--grafit);background:#FBFBFC;box-shadow:0 0 0 3px rgba(34,37,42,.06)}
.izbor.izabrana .ik{background:var(--grafit);color:var(--zlatna)}

/* ---------- potvrde (velike) ---------- */
.potvrda{
  display:flex;align-items:center;gap:13px;padding:14px;background:#fff;
  border:1.5px solid var(--linija-jaka);border-radius:var(--r-m);margin-bottom:8px;cursor:pointer;
}
.potvrda .kvadrat{
  width:28px;height:28px;flex:none;border-radius:7px;border:2px solid var(--linija-jaka);
  background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;
}
.potvrda .txt{font-size:15px;font-weight:600;line-height:1.3}
.potvrda.cek{border-color:var(--zelena);background:var(--zelena-bg)}
.potvrda.cek .kvadrat{background:var(--zelena);border-color:var(--zelena)}
.potvrda.cek .txt{color:#1F5A3B}

/* ---------- foto ---------- */
.foto{
  border:1.5px dashed var(--linija-jaka);border-radius:var(--r-m);background:#FAFAFB;
  padding:18px;display:flex;align-items:center;gap:12px;cursor:pointer;
}
.foto .ik{width:44px;height:44px;flex:none;border-radius:var(--r-s);background:var(--grafit);color:var(--zlatna);display:flex;align-items:center;justify-content:center}
.foto .t1{font-size:15px;font-weight:600}
.foto .t2{font-size:12px;color:var(--tekst-3)}
.foto.ima{border-style:solid;border-color:var(--zelena);background:var(--zelena-bg)}
.foto.ima .ik{background:var(--zelena);color:#fff}
.foto.ima .t1{color:#1F5A3B}
.foto img{width:52px;height:52px;object-fit:cover;border-radius:var(--r-s);border:1px solid var(--linija)}
.foto input{display:none}

/* ---------- dugmad ---------- */
.dugme{
  width:100%;padding:17px;border:none;border-radius:var(--r-m);
  font-size:17px;font-weight:700;cursor:pointer;letter-spacing:-.2px;
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.d-glavno{background:var(--grafit);color:#fff}
.d-glavno:active{background:#15171B}
.d-zlato{background:var(--zlatna);color:var(--grafit)}
.d-zlato:active{background:#A9843B}
.d-obrub{background:#fff;color:var(--tekst);border:1.5px solid var(--linija-jaka)}
.d-crveno{background:var(--crvena);color:#fff}
.d-zeleno{background:var(--zelena);color:#fff}
.d-malo{padding:12px;font-size:15px}
.dno-akcija{
  position:sticky;bottom:0;margin:20px -16px -16px;padding:14px 16px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(244,245,246,0) 0%,var(--pozadina) 28%);
}

/* ---------- info red / pregled ---------- */
.red{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--linija)}
.red:last-child{border-bottom:none}
.red .k{font-size:14px;color:var(--tekst-2)}
.red .v{font-size:15px;font-weight:600;text-align:right}
.red .v.mono{font-variant-numeric:tabular-nums}

.novac-mreza{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.novac{border:1px solid var(--linija);border-radius:var(--r-m);padding:12px;background:#FBFBFC}
.novac .val{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--zlatna);text-transform:uppercase}
.novac .iznos{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px;margin-top:2px}
.novac .opis{font-size:12px;color:var(--tekst-2)}
.novac.pozitivno .iznos{color:var(--zelena)}
.novac.negativno .iznos{color:var(--crvena)}

/* ---------- upozorenje ---------- */
.napomena{
  display:flex;gap:11px;padding:13px 14px;border-radius:var(--r-m);font-size:14px;line-height:1.45;
  background:var(--plava-bg);border:1px solid #CBDCEC;color:#1F4569;margin-bottom:12px;
}
.napomena.upozorenje{background:var(--narandzasta-bg);border-color:#EBD6AE;color:#7A4E0E}
.napomena.greska{background:var(--crvena-bg);border-color:#EFCFCB;color:#8A241D}
.napomena .ik{flex:none;margin-top:1px}
.napomena b{font-weight:700}

/* ---------- lista terena ---------- */
.stavka{
  display:block;width:100%;text-align:left;background:var(--karta);border:1px solid var(--linija);
  border-radius:var(--r-l);padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sen);
}
.stavka:active{background:#FAFAFB}
.stavka .gore{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.stavka .proj{font-size:16px;font-weight:700;letter-spacing:-.2px}
.stavka .meta{font-size:13px;color:var(--tekst-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.stavka .dole{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--linija);flex-wrap:wrap}
.cip{font-size:12px;font-weight:600;color:var(--tekst-2);background:#F2F3F5;border-radius:6px;padding:4px 8px;font-variant-numeric:tabular-nums}

/* ---------- tabovi ---------- */
.tabovi{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;-ms-overflow-style:none;scrollbar-width:none}
.tabovi::-webkit-scrollbar{display:none}
.tab{
  white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid var(--linija-jaka);
  background:#fff;font-size:14px;font-weight:600;color:var(--tekst-2);cursor:pointer;
}
.tab.aktivan{background:var(--grafit);border-color:var(--grafit);color:#fff}
.tab .br{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}

/* ---------- trošak red ---------- */
.trosak{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linija)}
.trosak:last-child{border-bottom:none}
.trosak .ik{width:36px;height:36px;flex:none;border-radius:var(--r-s);background:#F0F1F3;color:var(--grafit);display:flex;align-items:center;justify-content:center}
.trosak .sred{flex:1;min-width:0}
.trosak .n1{font-size:15px;font-weight:600}
.trosak .n2{font-size:12px;color:var(--tekst-2)}
.trosak .iz{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.trosak .iz small{display:block;font-size:11px;font-weight:600;color:var(--tekst-3)}

/* ---------- galerija dokaza ---------- */
.galerija{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dokaz{
  aspect-ratio:3/4;border-radius:var(--r-s);border:1px solid var(--linija);overflow:hidden;
  background:linear-gradient(150deg,#E9EBEE 0%,#F6F7F8 55%,#DDE0E4 100%);
  display:flex;flex-direction:column;justify-content:flex-end;padding:6px;cursor:pointer;position:relative;
}
.dokaz .lab{font-size:10px;font-weight:700;color:var(--tekst-2);background:rgba(255,255,255,.9);border-radius:4px;padding:2px 5px;text-align:center}
.dokaz .sim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#B7BCC3}

/* ---------- donja navigacija ---------- */
.nav{
  position:sticky;bottom:0;background:#fff;border-top:1px solid var(--linija);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:30;
}
.nav button{
  flex:1;background:none;border:none;padding:9px 4px 11px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tekst-3);font-size:11px;font-weight:600;
}
.nav button.aktivan{color:var(--grafit)}
.nav button.aktivan .pod{width:22px;height:3px;border-radius:2px;background:var(--zlatna);margin-top:1px}
.nav button .pod{width:22px;height:3px;margin-top:1px}

/* ---------- modal / toast ---------- */
.zavesa{position:fixed;inset:0;background:rgba(20,22,26,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{
  background:#fff;width:100%;max-width:480px;border-radius:var(--r-l) var(--r-l) 0 0;
  padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom));box-shadow:var(--sen-jaka);
}
.modal h3{font-size:19px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px}
.modal p{font-size:14px;color:var(--tekst-2);margin-bottom:16px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:70;
  background:var(--grafit);color:#fff;padding:13px 18px;border-radius:var(--r-m);
  font-size:14px;font-weight:600;box-shadow:var(--sen-jaka);display:flex;align-items:center;gap:9px;
  max-width:88%;border-left:3px solid var(--zlatna);
}

/* ---------- ekran za prijavu ---------- */
.prijava-ekran{
  flex:1;background:var(--grafit);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;
}
.prijava-ekran .znak{width:64px;height:64px;border-radius:var(--r-m);border:2px solid var(--zlatna);color:var(--zlatna);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.prijava-ekran h1{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.prijava-ekran .pod{color:var(--zlatna);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:26px}
.prijava-ekran .unos{background:var(--grafit-2);border-color:var(--grafit-3);color:#fff}
.prijava-ekran .unos::placeholder{color:#79808B}
.prijava-ekran label{color:#A8AEB7}
.brzi{margin-top:22px;border-top:1px solid var(--grafit-3);padding-top:16px}
.brzi .nas{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#79808B;font-weight:700;margin-bottom:10px}
.brzi button{
  width:100%;text-align:left;background:var(--grafit-2);border:1px solid var(--grafit-3);color:#fff;
  border-radius:var(--r-m);padding:13px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;
}
.brzi button .kr{width:34px;height:34px;border-radius:50%;background:var(--grafit-3);color:var(--zlatna);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.brzi button .u{font-size:15px;font-weight:600}
.brzi button .r{font-size:12px;color:#8E959F}

.prazno{text-align:center;padding:44px 20px;color:var(--tekst-3)}
.prazno .ik{margin-bottom:12px;color:var(--linija-jaka)}
.prazno .t{font-size:15px;font-weight:600;color:var(--tekst-2)}
.prazno .p{font-size:13px;margin-top:4px}

.demo-traka{
  background:var(--zlatna-blaga);border-bottom:1px solid #E8DCC2;color:#6B5320;
  font-size:11px;font-weight:600;text-align:center;padding:6px 12px;letter-spacing:.02em;
}
</style>
</head>

/* ============================================================
   3. POMOĆNE FUNKCIJE
   ============================================================ */
function brojF(n, dec){
  dec = (dec===undefined) ? 2 : dec;
  const neg = n<0; n = Math.abs(n);
  let s = n.toFixed(dec);
  let [c,d] = s.split('.');
  c = c.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg?'-':'') + c + (d ? ','+d : '');
}
function novac(n, val){ return brojF(n, val==='RSD'?0:2) + ' ' + val; }
function km(n){ return brojF(n,0) + ' km'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function po(id, niz){ return niz.find(x=>x.id===id) || {}; }
function korisnik(id){ return po(id, DB.korisnici); }
function vozilo(id){ return po(id, DB.vozila); }
function teren(id){ return po(id, DB.tereni); }

/* obračun jednog terena */
function obracun(t){
  const o = {
    gotEUR:0, gotRSD:0, karEUR:0, karRSD:0, licEUR:0, licRSD:0,
    litri:0, gorivoEUR:0, gorivoRSD:0, brojRacuna:0, bezRacuna:0
  };
  t.troskovi.forEach(tr=>{
    const kljuc = (tr.nacin==='gotovina'?'got':tr.nacin==='kartica'?'kar':'lic') + tr.val;
    o[kljuc] += tr.iznos;
    if(tr.vrsta==='gorivo'){
      o.litri += (tr.litri||0);
      o['gorivo'+tr.val] += tr.iznos;
    }
    if(tr.racun) o.brojRacuna++; else o.bezRacuna++;
  });
  o.ocekEUR = t.depozit_eur - o.gotEUR;
  o.ocekRSD = t.depozit_rsd - o.gotRSD;
  o.km = (t.km_kraj!=null) ? (t.km_kraj - t.km_start) : null;
  o.potrosnja = (o.km && o.litri) ? (o.litri / o.km * 100) : null;
  const v = vozilo(t.vozilo);
  o.ocekPotrosnja = v.potrosnja || null;
  o.odstupanje = (o.potrosnja && o.ocekPotrosnja) ? ((o.potrosnja - o.ocekPotrosnja)/o.ocekPotrosnja*100) : null;
  o.upozorenje = (o.odstupanje!=null && Math.abs(o.odstupanje) > 15);
  if(t.status==='odobren' || t.status==='pregled' || t.status==='ispravka'){
    o.razEUR = (t.vraceno_eur!=null) ? (t.vraceno_eur - o.ocekEUR) : null;
    o.razRSD = (t.vraceno_rsd!=null) ? (t.vraceno_rsd - o.ocekRSD) : null;
  }
  return o;
}

function uzmiFoto(e, kljuc){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ S.n[kljuc] = r.result; crtaj(); };
  r.readAsDataURL(f);
}
function potvrdaRed(kljuc, tekst){
  const c = !!S.n[kljuc];

    '<div class="kvadrat">'+(c?I('cek',16):'')+'</div>'+
    '<div class="txt">'+esc(tekst)+'</div>'+
  '</div>';
}
function prekidac(k){ S.n[k] = !S.n[k]; crtaj(); }
function postavi(k, v){ S.n[k] = v; crtaj(); }

function kmRezultat(t){
  const v = parseInt(S.n.km_kraj,10);
  if(!v) return 'Ukupno pređeno: —';
  if(v < t.km_start) return '<span style="color:var(--crvena);font-weight:600">Manje od polazne kilometraže.</span>';
  return 'Ukupno pređeno: <b>'+brojF(v - t.km_start,0)+' km</b>';
}
function osveziKm(){
  const t = mojAktivan();
  const el = document.getElementById('km-rezultat');
  if(el) el.innerHTML = kmRezultat(t);
}
function razlikaHTML(o){
  const e = S.n.vr_eur==null||S.n.vr_eur==='' ? null : parseFloat(S.n.vr_eur);
  const r = S.n.vr_rsd==null||S.n.vr_rsd==='' ? null : parseFloat(S.n.vr_rsd);
  if(e===null && r===null) return '';
  const de = (e===null)?0:(e - o.ocekEUR);
  const dr = (r===null)?0:(r - o.ocekRSD);
  if(Math.abs(de)<0.01 && Math.abs(dr)<1){
    return '<div class="napomena" style="margin:0;background:var(--zelena-bg);border-color:#C9E3D6;color:#1F5A3B">'+I('cek',18)+'<div>Iznosi se slažu sa obračunom.</div></div>';
  }
  const delovi = [];
  if(Math.abs(de)>=0.01) delovi.push((de>0?'višak ':'manjak ')+brojF(Math.abs(de),2)+' EUR');
  if(Math.abs(dr)>=1)    delovi.push((dr>0?'višak ':'manjak ')+brojF(Math.abs(dr),0)+' RSD');
  return '<div class="napomena upozorenje" style="margin:0">'+I('alarm',18)+'<div>Razlika u odnosu na obračun: <b>'+delovi.join(', ')+'</b>. Ako je to tačno, dodaj kratko objašnjenje ispod.</div></div>';
}
function osveziRazliku(){
  const t = mojAktivan();
  const el = document.getElementById('razlika');
  if(el) el.innerHTML = razlikaHTML(obracun(t));
}
function sacuvajPovratak(){
  const t = mojAktivan();
  if(!S.n.km_kraj){ poruka('Unesi završnu kilometražu','alarm'); return; }
  if(parseInt(S.n.km_kraj,10) < t.km_start){ poruka('Kilometraža je manja od polazne','alarm'); return; }
  const o = obracun(t);
  t.km_kraj = parseInt(S.n.km_kraj,10);
  t.vraceno_eur = (S.n.vr_eur==null||S.n.vr_eur==='') ? o.ocekEUR : parseFloat(S.n.vr_eur);
  t.vraceno_rsd = (S.n.vr_rsd==null||S.n.vr_rsd==='') ? o.ocekRSD : parseFloat(S.n.vr_rsd);
  t.povratak = '25.07.2026. '+new Date().toTimeString().slice(0,5);
  t.pk = {vozilo:!!S.n.k_vozilo, kabina:!!S.n.k_kabina, alat:!!S.n.k_alat, racuni:!!S.n.k_racuni};
  t.nap_povratak = S.n.nap_k || '';
  t.status = 'pregled';
  S.n = {};
  poruka('Izveštaj je poslat kancelariji');
  idi('moji');
}

  const moji = DB.tereni.filter(t=>t.sef===S.ja);

  }
  if(!moji.length){
    h += prazno('lista','Nema terena','Tvoji tereni će se pojaviti ovde.');
  } else {

function stavkaTerena(t, ko){
  const o = obracun(t);
  const v = vozilo(t.vozilo);
  const k = korisnik(t.sef);

    '</div>'+
    '<div class="meta" style="margin-top:2px"><span>'+esc(t.polazak.split(' ')[0])+(t.povratak?' – '+esc(t.povratak.split(' ')[0]):' – u toku')+'</span></div>'+

function scAdmin(){
  let h = '<div class="top"><div class="rast"><div class="marka">Prohoreca AG group</div><div class="naslov">Pregled terena</div></div>'+
    '<div class="avatar" onclick="odjava()">'+I('stit',18)+'</div></div>';

  const grupe = {
    aktivan: DB.tereni.filter(t=>t.status==='aktivan'),
    pregled: DB.tereni.filter(t=>t.status==='pregled'),
    ispravka:DB.tereni.filter(t=>t.status==='ispravka'),
    odobren: DB.tereni.filter(t=>t.status==='odobren')
  };
  h += '<div class="tabovi">'+
    tabDug('aktivan','Aktivni',grupe.aktivan.length)+
    tabDug('pregled','Čeka pregled',grupe.pregled.length)+
    tabDug('ispravka','Na ispravci',grupe.ispravka.length)+
    tabDug('odobren','Odobreni',grupe.odobren.length)+

  h += '</div>'+navAdmin('tereni');

}
function tabDug(k,n,br){
  return '<button class="tab '+(S.tab===k?'aktivan':'')+'" onclick="idi(\'admin\',{tab:\''+k+'\'})">'+esc(n)+'<span class="br">'+br+'</span></button>';
}
function navAdmin(a){
  return '<div class="nav">'+
    '<button class="'+(a==='tereni'?'aktivan':'')+'" onclick="idi(\'admin\')">'+I('lista',22)+'<span>Tereni</span><div class="pod"></div></button>'+

  '</div>';
}

/* ============================================================
   14. EKRAN: DETALJAN IZVEŠTAJ
   ============================================================ */
function scIzvestaj(zaSefa){
  const t = teren(S.otvoren);
  const o = obracun(t);
  const v = vozilo(t.vozilo);
  const k = korisnik(t.sef);
  let h = zaglavlje('Izveštaj sa terena', zaSefa?'moji':'admin');
  h += '<div class="sadrzaj">';

  /* --- osnovno --- */
  h += '<div class="karta"><div class="karta-telo">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px">'+
      '<div style="font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.25">'+esc(t.projekat)+'</div>'+oznaka(t.status)+'</div>'+
    '<div class="red"><span class="k">Šef ekipe</span><span class="v">'+esc(k.ime)+'</span></div>'+
    '<div class="red"><span class="k">Vozilo</span><span class="v">'+esc(v.naziv)+' · '+esc(v.reg)+'</span></div>'+
    '<div class="red"><span class="k">Polazak</span><span class="v mono">'+esc(t.polazak)+'</span></div>'+
    '<div class="red"><span class="k">Povratak</span><span class="v mono">'+(t.povratak?esc(t.povratak):'u toku')+'</span></div>'+
    (t.odobrio?'<div class="red"><span class="k">Odobrio</span><span class="v">'+esc(t.odobrio)+'</span></div>':'')+
  '</div></div>';

  if(t.status==='ispravka' && t.komentar_admina){
    h += '<div class="napomena greska">'+I('vrati',18)+'<div><b>Vraćeno na ispravku:</b><br>'+esc(t.komentar_admina)+'</div></div>';
  }

  /* --- novac --- */
  h += '<div class="sekcija-naslov">Novac – EUR i RSD odvojeno</div>';
  h += '<div class="karta"><div class="karta-zaglavlje">'+I('novac',16)+' Gotovina iz depozita</div><div class="karta-telo">'+
    novacTabela([
      ['Primljen depozit', t.depozit_eur, t.depozit_rsd],
      ['Potrošeno gotovinom', -o.gotEUR, -o.gotRSD],
      ['Očekivano za vraćanje', o.ocekEUR, o.ocekRSD],
      ['Stvarno vraćeno', t.vraceno_eur, t.vraceno_rsd]
    ])+
    (t.vraceno_eur!=null ? razlikaRed(t.vraceno_eur - o.ocekEUR, t.vraceno_rsd - o.ocekRSD) : '')+
  '</div></div>';

  h += '<div class="karta"><div class="karta-zaglavlje">'+I('kartica',16)+' Službena kartica</div><div class="karta-telo">'+
    '<div class="novac-mreza">'+
      '<div class="novac"><div class="val">EUR</div><div class="iznos">'+brojF(o.karEUR,2)+'</div><div class="opis">ne dira depozit</div></div>'+
      '<div class="novac"><div class="val">RSD</div><div class="iznos">'+brojF(o.karRSD,0)+'</div><div class="opis">ne dira depozit</div></div>'+
    '</div></div></div>';

  h += '<div class="karta" style="'+((o.licEUR||o.licRSD)?'border-color:var(--zlatna)':'')+'"><div class="karta-zaglavlje">'+I('novcanik',16)+' Lični novac zaposlenog</div><div class="karta-telo">'+
    '<div class="novac-mreza">'+
      '<div class="novac '+(o.licEUR?'negativno':'')+'"><div class="val">EUR</div><div class="iznos">'+brojF(o.licEUR,2)+'</div><div class="opis">dug firme prema zaposlenom</div></div>'+
      '<div class="novac '+(o.licRSD?'negativno':'')+'"><div class="val">RSD</div><div class="iznos">'+brojF(o.licRSD,0)+'</div><div class="opis">dug firme prema zaposlenom</div></div>'+
    '</div></div></div>';

  /* --- kilometraža i gorivo --- */
  h += '<div class="sekcija-naslov">Kilometraža i gorivo</div>';
  h += '<div class="karta"><div class="karta-telo">'+
    '<div class="red"><span class="k">Početna kilometraža</span><span class="v mono">'+km(t.km_start)+'</span></div>'+
    '<div class="red"><span class="k">Završna kilometraža</span><span class="v mono">'+(t.km_kraj!=null?km(t.km_kraj):'—')+'</span></div>'+
    '<div class="red"><span class="k">Ukupno pređeno</span><span class="v mono">'+(o.km!=null?km(o.km):'—')+'</span></div>'+
    '<div class="red"><span class="k">Ukupno sipano</span><span class="v mono">'+brojF(o.litri,1)+' L</span></div>'+
    '<div class="red"><span class="k">Trošak goriva</span><span class="v mono">'+
      ([o.gorivoRSD?novac(o.gorivoRSD,'RSD'):null, o.gorivoEUR?novac(o.gorivoEUR,'EUR'):null].filter(Boolean).join('<br>') || '—')+
    '</span></div>'+
    '<div class="red"><span class="k">Prosečna potrošnja</span><span class="v mono">'+(o.potrosnja?brojF(o.potrosnja,1)+' L/100 km':'—')+'</span></div>'+
    '<div class="red"><span class="k">Očekivano za vozilo</span><span class="v mono">'+(o.ocekPotrosnja?brojF(o.ocekPotrosnja,1)+' L/100 km':'—')+'</span></div>'+
  '</div></div>';

  if(o.odstupanje!=null){
    if(o.upozorenje){
      h += '<div class="napomena upozorenje">'+I('alarm',18)+'<div><b>Odstupanje '+(o.odstupanje>0?'+':'')+brojF(o.odstupanje,1)+'% u odnosu na očekivanu potrošnju.</b><br>'+
        'Ovo je samo signal za proveru – uzrok može biti teret, teren, gužva ili greška u unosu.</div></div>';
    } else {
      h += '<div class="napomena" style="background:var(--zelena-bg);border-color:#C9E3D6;color:#1F5A3B">'+I('cek',18)+
        '<div>Potrošnja je u očekivanom opsegu ('+(o.odstupanje>0?'+':'')+brojF(o.odstupanje,1)+'%).</div></div>';
    }
  }

  /* --- troškovi --- */
  h += '<div class="sekcija-naslov">Troškovi ('+t.troskovi.length+')</div>';
  h += '<div class="karta"><div class="karta-telo">';
  if(!t.troskovi.length) h += '<div style="color:var(--tekst-3);font-size:14px">Nema unetih troškova.</div>';
  t.troskovi.forEach(tr=>{
    h += '<div class="trosak">'+
      '<div class="ik">'+I(VRSTE[tr.vrsta].ik,18)+'</div>'+
      '<div class="sred"><div class="n1">'+esc(VRSTE[tr.vrsta].n)+'</div>'+
        '<div class="n2">'+esc(tr.vreme)+' · '+esc(PLACANJA[tr.nacin].k)+
        (tr.vrsta==='gorivo'&&tr.litri?' · '+brojF(tr.litri,1)+' L na '+brojF(tr.km,0)+' km':'')+
        (tr.racun?'':' · <span style="color:var(--crvena)">bez računa</span>')+'</div></div>'+
      '<div class="iz">'+brojF(tr.iznos, tr.val==='RSD'?0:2)+'<small>'+tr.val+'</small></div>'+
    '</div>';
  });
  h += '</div></div>';

  /* --- dokazi --- */
  const dokazi = [];
  dokazi.push({l:'Km polazak', ik:'slika'});
  if(t.km_kraj!=null) dokazi.push({l:'Km povratak', ik:'slika'});
  t.troskovi.forEach(tr=>{
    if(tr.racun) dokazi.push({l:'Račun · '+VRSTE[tr.vrsta].n.split(' ')[0], ik:'racun'});
    if(tr.slip)  dokazi.push({l:'Slip', ik:'kartica'});
  });
  t.prijave.forEach(p=>{ if(p.foto) dokazi.push({l:'Prijava', ik:'alarm'}); });

  h += '<div class="sekcija-naslov">Računi, slipovi i fotografije ('+dokazi.length+')</div>';
  h += '<div class="galerija" style="margin-bottom:12px">'+
    dokazi.map(d=>'<div class="dokaz" onclick="poruka(\'Otvara se fotografija: '+esc(d.l)+'\',\'slika\')">'+
      '<div class="sim">'+I(d.ik,26)+'</div><div class="lab">'+esc(d.l)+'</div></div>').join('')+
  '</div>';

  /* --- prijave --- */
  h += '<div class="sekcija-naslov">Prijave sa terena ('+t.prijave.length+')</div>';
  if(!t.prijave.length){
    h += '<div class="karta"><div class="karta-telo" style="color:var(--tekst-3);font-size:14px">Nema prijava.</div></div>';
  } else {
    t.prijave.forEach(p=>{
      h += '<div class="karta"><div class="karta-telo">'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'+
          '<div style="width:32px;height:32px;border-radius:8px;background:var(--grafit);color:var(--zlatna);display:flex;align-items:center;justify-content:center">'+I(TIPOVI_PRIJAVE[p.tip].ik,17)+'</div>'+
          '<div><div style="font-size:15px;font-weight:700">'+esc(TIPOVI_PRIJAVE[p.tip].n)+'</div>'+
          '<div style="font-size:12px;color:var(--tekst-3)">'+esc(p.vreme)+(p.foto?' · sa fotografijom':'')+'</div></div>'+
        '</div>'+
        '<div style="font-size:15px;line-height:1.5">'+esc(p.opis)+'</div>'+
      '</div></div>';
    });
  }

  /* --- kontrolne liste --- */
  h += '<div class="sekcija-naslov">Potvrde šefa ekipe</div>';
  h += '<div class="karta"><div class="karta-telo">'+
    cekRed('Vozilo provereno na polasku', t.pp.vozilo)+
    cekRed('Gorivo provereno', t.pp.gorivo)+
    cekRed('Teret obezbeđen', t.pp.teret)+
    (t.nap_polazak?'<div class="napomena upozorenje" style="margin:10px 0 0">'+I('olovka',18)+'<div>'+esc(t.nap_polazak)+'</div></div>':'')+
    (t.pk ? '<div style="height:1px;background:var(--linija);margin:12px 0"></div>'+
      cekRed('Vozilo provereno na povratku', t.pk.vozilo)+
      cekRed('Kabina i tovarni prostor uredni', t.pk.kabina)+
      cekRed('Alat i materijal vraćeni', t.pk.alat)+
      cekRed('Svi računi uneti', t.pk.racuni)+
      (t.nap_povratak?'<div class="napomena upozorenje" style="margin:10px 0 0">'+I('olovka',18)+'<div>'+esc(t.nap_povratak)+'</div></div>':'')
    : '')+
  '</div></div>';

  /* --- admin akcije --- */
  if(!zaSefa && (t.status==='pregled' || t.status==='ispravka')){
    h += '<div class="sekcija-naslov">Odluka</div>';
    h += '<div style="display:grid;gap:10px;margin-bottom:20px">'+
      '<button class="dugme d-zeleno" onclick="odobri('+t.id+')">'+I('cek',20)+' Odobri izveštaj</button>'+
      '<button class="dugme d-obrub" onclick="otvoriVracanje('+t.id+')">'+I('vrati',20)+' Vrati na ispravku</button>'+
    '</div>';
  }
  if(zaSefa && t.status==='ispravka'){
    h += '<div class="dno-akcija"><button class="dugme d-zlato" onclick="poruka(\'Prototip: ovde se otvara ispravka unosa\',\'olovka\')">'+I('olovka',20)+' Ispravi izveštaj</button></div>';
  }

  h += '</div>';
  return h;
}
function cekRed(t, ok){
  return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14.5px">'+
    '<span style="color:'+(ok?'var(--zelena)':'var(--crvena)')+';display:flex">'+I(ok?'cek':'alarm',17)+'</span>'+
    '<span style="'+(ok?'':'color:var(--crvena);font-weight:600')+'">'+esc(t)+'</span></div>';
}
function novacTabela(redovi){
  return redovi.map(r=>{
    const [n, e, rs] = r;
    const fe = (e==null)?'—':brojF(e,2)+' EUR';
    const fr = (rs==null)?'—':brojF(rs,0)+' RSD';
    return '<div class="red"><span class="k">'+esc(n)+'</span><span class="v mono">'+fe+'<br>'+fr+'</span></div>';
  }).join('');
}
function razlikaRed(de, dr){
  if(Math.abs(de)<0.01 && Math.abs(dr)<1){
    return '<div class="napomena" style="margin:12px 0 0;background:var(--zelena-bg);border-color:#C9E3D6;color:#1F5A3B">'+I('cek',18)+'<div>Vraćeni iznosi se slažu sa obračunom.</div></div>';
  }
  const d = [];
  if(Math.abs(de)>=0.01) d.push((de>0?'višak ':'manjak ')+brojF(Math.abs(de),2)+' EUR');
  if(Math.abs(dr)>=1)    d.push((dr>0?'višak ':'manjak ')+brojF(Math.abs(dr),0)+' RSD');
  return '<div class="napomena upozorenje" style="margin:12px 0 0">'+I('alarm',18)+'<div>Razlika: <b>'+d.join(', ')+'</b> – proveriti sa šefom ekipe.</div></div>';
}
function odobri(id){
  const t = teren(id);
  t.status = 'odobren';
  t.odobrio = 'Kancelarija · 25.07.2026.';
  poruka('Izveštaj je odobren');
  idi('admin',{tab:'odobren'});
}
function otvoriVracanje(id){
  S.n.vracanje = id; S.n.komentar='';
  crtaj();
}
function modalVracanje(){
  return '<div class="zavesa" onclick="if(event.target===this){S.n.vracanje=null;crtaj()}">'+
    '<div class="modal">'+
      '<h3>Vrati na ispravku</h3>'+
      '<p>Šef ekipe će videti tvoj komentar i ispraviti izveštaj.</p>'+
      '<textarea class="unos" placeholder="npr. Fali račun za gorivo od 15.07." oninput="upisi(\'komentar\',this.value)">'+esc(S.n.komentar||'')+'</textarea>'+
      '<div style="display:grid;gap:9px;margin-top:14px">'+
        '<button class="dugme d-glavno" onclick="potvrdiVracanje()">Pošalji na ispravku</button>'+
        '<button class="dugme d-obrub d-malo" onclick="S.n.vracanje=null;crtaj()">Odustani</button>'+
      '</div>'+
    '</div></div>';
}
function potvrdiVracanje(){
  if(!S.n.komentar || S.n.komentar.trim().length<3){ poruka('Napiši komentar','alarm'); return; }
  const t = teren(S.n.vracanje);
  t.status='ispravka'; t.komentar_admina = S.n.komentar;
  S.n = {};
  poruka('Izveštaj je vraćen na ispravku');
  idi('admin',{tab:'ispravka'});
}

/* ============================================================
   17. RUTER
   ============================================================ */
function crtaj(){
  const app = document.getElementById('app');
  let h = '';
  if(S.ekran !== 'prijava'){
    h += '<div class="demo-traka">PROTOTIP – prikazani podaci su izmišljeni</div>';
  }
  switch(S.ekran){
    case 'prijava':      h += scPrijava(); break;
    case 'pocetna':      h += scPocetna(); break;
    case 'polazak':      h += scPolazak(); break;
    case 'trosak':       h += scTrosak(); break;
    case 'prijava_ter':  h += scPrijavaTeren(); break;
    case 'povratak':     h += scPovratak(); break;
    case 'moji':         h += scMoji(); break;
    case 'admin':        h += scAdmin(); break;
    case 'vozila':       h += scVozila(); break;
    case 'korisnici':    h += scKorisnici(); break;
    case 'izvestaj':     h += scIzvestaj(false); break;
    case 'izvestaj_sef': h += scIzvestaj(true); break;
    default:             h += scPrijava();
  }
  if(S.n.vracanje) h += modalVracanje();
  app.innerHTML = h;
}

crtaj();
</script>
</body>
